<script>
/* ═══════════════════════════════════════════════════════════════════
   Диагностика. Если скрипт где-то падает, страница обычно остаётся
   пустой: экраны скрыты и открывает их только код. Здесь мы ловим
   любую ошибку и показываем её прямо на странице, чтобы не искать
   в консоли.
   ═══════════════════════════════════════════════════════════════════ */
(function(){
  var box = null;
  function show(kind, text){
    if(!box){
      box = document.createElement('div');
      box.setAttribute('style',
        'position:fixed;left:0;right:0;bottom:0;z-index:99999;max-height:52vh;overflow:auto;'+
        'background:#2B1114;color:#FFD9DC;border-top:2px solid #E8596A;'+
        'font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px 14px 40px;');
      var close = document.createElement('button');
      close.textContent = 'скрыть';
      close.setAttribute('style','position:absolute;right:10px;top:8px;background:none;border:1px solid #E8596A;'+
        'color:#FFD9DC;border-radius:6px;padding:3px 9px;font:inherit;cursor:pointer');
      close.onclick = function(){ box.remove(); box = null; };
      box.appendChild(close);
      var head = document.createElement('div');
      head.textContent = 'Ошибка на странице — покажите этот текст';
      head.setAttribute('style','font-weight:700;margin-bottom:8px');
      box.appendChild(head);
      (document.body || document.documentElement).appendChild(box);
    }
    var row = document.createElement('div');
    row.setAttribute('style','margin-bottom:7px;white-space:pre-wrap;word-break:break-word');
    row.textContent = kind + ': ' + text;
    box.appendChild(row);
  }
  window.addEventListener('error', function(e){
    show('Ошибка', (e.message || 'без описания') + '  →  ' +
      String(e.filename || '').split('/').pop() + ':' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason;
    show('Обещание', (r && (r.message || r)) || 'без описания');
  });
})();
</script>

  'prompt-deck|delete' : 'Удалили промт',
  'prompt-deck|edit'   : 'Изменили промт',
  'music|delete'       : 'Удалили трек',

const deedName = e => {
  if(e.service.startsWith('link:')) return 'Перешли в ' + linkName(e.service.slice(5));
  return DEEDS[e.service+'|'+(e.detail||'open')]
      || ((NAMES[e.service]||e.service) + ' · ' + (e.detail||'действие'));
};
/* имя внешнего сервиса: из базы, иначе из списка по умолчанию, иначе сам id */
function linkName(id){
  /* до 11 августа у встроенных ссылок не было id, и в базу писалось
     link:undefined — такие записи уже не восстановить, подписываем честно */
  if(!id || id === 'undefined' || id === 'null') return 'внешний сервис (не определился)';
  const fromDb = links.find(l => l.id === id);
  if(fromDb) return fromDb.name;
  const fallback = DEFAULT_LINKS.find(l => l.id === id);
  return fallback ? fallback.name : id;
}

  return x>10&&x<20?c : y>1&&y<5?b : y===1?a : c; };
const dayKey = d => d.toISOString().slice(0,10);

/* ── запросы ─────────────────────────────────────────────────────── */
async function api(db, path, opts={}){
  /* headers достаём отдельно: если слить наивно, opts.headers перетрёт
     объект с ключом, и база ответит «No API key found in request» */
  const { headers, ...rest } = opts;
  const r = await fetch(db.url+'/rest/v1/'+path, Object.assign({}, rest, {
    headers: Object.assign({ apikey:db.key, 'Content-Type':'application/json' }, headers || {})
  }));
  const txt = await r.text();
  let data=null; try{ data = txt ? JSON.parse(txt) : null }catch(e){ data = txt }
  if(!r.ok) throw new Error((data && (data.message||data.hint)) || ('HTTP '+r.status));
  return data;
}
const get   = (db,p) => api(db,p);
const patch = (db,p,body) => api(db,p,{method:'PATCH',body:JSON.stringify(body),headers:{Prefer:'return=representation'}});
const post  = (db,p,body) => api(db,p,{method:'POST', body:JSON.stringify(body),headers:{Prefer:'return=representation'}});
const del   = (db,p) => api(db,p,{method:'DELETE',headers:{Prefer:'return=minimal'}});

let events=[], services=[], links=[], presence=[], failed=null;

async function loadAll(){
  failed=null;
  const since = new Date(Date.now() - DAYS*864e5).toISOString();
  try{
    [events, services, links, presence] = await Promise.all([
      get(MAIN, `hub_events?select=*&at=gte.${since}&order=at.desc&limit=5000`),
      get(MAIN, 'hub_services?select=*&order=sort.asc'),
      get(MAIN, 'hub_links?select=*&order=sort.asc'),
      get(MAIN, 'hub_presence?select=*&order=last_seen.desc').catch(()=>[]),
    ]);
  }catch(e){ failed = e.message; events=[]; services=[]; links=[]; presence=[]; }
  renderStats(); renderCfg(); renderVaultTab(); renderOps();
}

/* ── статистика ──────────────────────────────────────────────────── */
function renderStats(){
  const box = $('#mgmt-tab-stats');
  if(failed){
    box.innerHTML = `<div class="mgmt-card"><div class="mgmt-lab">база не отвечает</div>
      <div style="font-size:14px">${esc(failed)}</div>
      <div class="mgmt-note mgmt-warn"><span>!</span><span>Если таблиц ещё нет — выполните <b>hub-admin.sql</b> в SQL Editor проекта Prompt Deck, затем нажмите «Обновить».</span></div></div>`;
    return;
  }
  if(!events.length){
    box.innerHTML = `<div class="mgmt-card"><div class="mgmt-lab">пока пусто</div>
      <div class="mgmt-empty">Событий за ${DAYS} дней нет. Откройте хаб в другой вкладке — первое событие появится сразу.</div></div>`;
    return;
  }

  /* Имя дизайнера по идентификатору браузера — из таблицы присутствия.
     Кто ни разу не представлялся на главной, остаётся под коротким кодом. */
  const nameOf = v => {
    const p = presence.find(x => x.visitor === v);
    return p && p.name ? esc(p.name) : String(v).slice(0,6);
  };
  const named = new Set(presence.filter(p => p.name).map(p => p.visitor));

  const opens = events.filter(e => e.kind === 'open');
  const acts  = events.filter(e => e.kind === 'action');
  const d7 = Date.now() - 7*864e5;
  const opens7 = opens.filter(e => new Date(e.at) >= d7);
  const visitors = new Set(events.map(e => e.visitor));
  const visitors7 = new Set(events.filter(e => new Date(e.at) >= d7).map(e => e.visitor));
  const mobile = events.filter(e => e.device === 'mobile').length;

  /* по сервисам */
  const byService = {};
  opens.filter(e => e.service !== 'hub').forEach(e => byService[e.service] = (byService[e.service]||0)+1);
  const svcRows = Object.entries(byService).sort((a,b)=>b[1]-a[1]);

  /* по дням */
  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(Date.now()-i*864e5); days.push([dayKey(d), 0]); }
  const idx = Object.fromEntries(days.map(([k],i)=>[k,i]));
  opens.forEach(e => { const k = dayKey(new Date(e.at)); if(k in idx) days[idx[k]][1]++; });
  const maxDay = Math.max(1, ...days.map(d=>d[1]));
  const liveDays = days.filter(d => d[1] > 0).length;          // дней, в которые вообще заходили
  const weekSum = days.slice(-7).reduce((s,d) => s + d[1], 0);
  const prevSum = days.slice(0,7).reduce((s,d) => s + d[1], 0);

  /* внешние ссылки */
  const byLink = {};
  acts.filter(e => e.service.startsWith('link:')).forEach(e => {
    const id = e.service.slice(5); byLink[id] = (byLink[id]||0)+1;
  });
  const linkRows = Object.entries(byLink).sort((a,b)=>b[1]-a[1]);

  /* действия — все, включая переходы по внешним ссылкам, одним списком */
  const byAct = {};
  acts.forEach(e => { const k = deedName(e); byAct[k] = (byAct[k]||0)+1; });
  const actRows = Object.entries(byAct).sort((a,b)=>b[1]-a[1]);
  const topDeed = actRows[0];

  /* удаления и правки — отдельно: это то, что нельзя пропустить */
  const changes = acts.filter(e => e.detail === 'delete' || e.detail === 'edit');

  const bars = rows => {
    const max = Math.max(1, ...rows.map(r=>r[1]));
    return `<div class="mgmt-bars">${rows.map(([k,v]) => `
      <div class="mgmt-bar"><span class="mgmt-n">${esc(k)}</span><span class="mgmt-c">${v}</span>
        <span class="mgmt-t"><i style="width:${Math.round(v/max*100)}%"></i></span></div>`).join('')}</div>`;
  };

  /* онлайн — обновлялись за последние три минуты; вкладка в фоне тоже считается */
  const ONLINE = 3*60*1000, now = Date.now();
  const seen = presence.map(p => Object.assign({}, p, {ago: now - new Date(p.last_seen)}));
  const online = seen.filter(p => p.ago < ONLINE);
  const today  = seen.filter(p => p.ago >= ONLINE && new Date(p.last_seen).toDateString() === new Date().toDateString());
  const ago = ms => ms < 60000 ? 'только что'
    : ms < 36e5 ? Math.round(ms/60000)+' мин назад'
    : Math.round(ms/36e5)+' ч назад';
  const who = p => p.name ? esc(p.name) : '<span style="color:var(--faint)">браузер '+String(p.visitor).slice(0,6)+'</span>';
  const where = p => NAMES[p.screen] || p.screen || 'хаб';

  const presenceCard = presence.length ? `
    <div class="mgmt-card">
      <div class="mgmt-lab">сейчас в хабе — ${online.length}</div>
      ${online.length ? `<table><tbody>${online.map(p => `
        <tr>
          <td style="width:34%">${who(p)}</td>
          <td>${esc(where(p))}</td>
          <td class="mgmt-mono">${p.device === 'mobile' ? 'телефон' : 'компьютер'}</td>
          <td class="mgmt-mono" style="text-align:right">${ago(p.ago)}</td>
        </tr>`).join('')}</tbody></table>`
        : '<div class="mgmt-empty">Прямо сейчас хаб ни у кого не открыт.</div>'}
      ${today.length ? `<div class="mgmt-lab" style="margin:18px 0 10px">были сегодня</div>
        <table><tbody>${today.map(p => `
        <tr><td style="width:34%">${who(p)}</td><td>${esc(where(p))}</td>
            <td class="mgmt-mono">${p.device === 'mobile' ? 'телефон' : 'компьютер'}</td>
            <td class="mgmt-mono" style="text-align:right">${ago(p.ago)}</td></tr>`).join('')}</tbody></table>` : ''}
      <div class="mgmt-note mgmt-info"><span>i</span><span>Имя берётся из деки — его выбирают при добавлении промта. Кто ничего не добавлял, показан как браузер. Вкладка в фоне тоже считается открытой.</span></div>
    </div>` : '';

  box.innerHTML = presenceCard + `
    <div class="mgmt-kpis">
      <div class="mgmt-kpi"><div class="mgmt-v">${opens7.length}</div><div class="mgmt-k">открытий за 7 дней</div>
        <div class="mgmt-d">за ${DAYS} дней — ${opens.length}</div></div>
      <div class="mgmt-kpi"><div class="mgmt-v">${visitors7.size}</div><div class="mgmt-k">браузеров за 7 дней</div>
        <div class="mgmt-d">всего ${visitors.size} ${plural(visitors.size,'браузер','браузера','браузеров')}</div></div>
      <div class="mgmt-kpi"><div class="mgmt-v">${acts.length}</div><div class="mgmt-k">нажатий кнопок</div>
        <div class="mgmt-d">${topDeed ? 'чаще всего: ' + esc(topDeed[0].toLowerCase()) + ' — ' + topDeed[1] : 'пока ничего не нажимали'}</div></div>
      <div class="mgmt-kpi"><div class="mgmt-v">${Math.round(mobile/events.length*100)}%</div><div class="mgmt-k">с телефона</div>
        <div class="mgmt-d">по ширине экрана</div></div>
    </div>

    ${liveDays < 3 ? '' : `<div class="mgmt-card">
      <div class="mgmt-lab">открытия по дням, две недели</div>
      <div class="mgmt-spark">${days.map(([k,v]) =>
        `<div class="${v ? '' : 'mgmt-zero'}" title="${k}: ${v}">${v ? '<b>'+v+'</b>' : ''}<i style="height:${Math.round(v/maxDay*100)}%"></i></div>`).join('')}</div>
      <div class="mgmt-spark-x">${days.map(([k],i) =>
        `<span>${i%2===0 ? k.slice(8)+'.'+k.slice(5,7) : ''}</span>`).join('')}</div>
      <div class="mgmt-note mgmt-info"><span>i</span><span>За последнюю неделю ${weekSum}, за предыдущую ${prevSum}.
        ${prevSum ? (weekSum > prevSum ? 'Стали заходить чаще.' : weekSum < prevSum ? 'Стали заходить реже.' : 'Ровно столько же.')
                  : 'Сравнивать пока не с чем — статистика молодая.'}</span></div>
    </div>`}

    <div class="mgmt-card">
      <div class="mgmt-lab">какие сервисы открывают</div>
      ${svcRows.length ? bars(svcRows.map(([k,v]) => [NAMES[k]||k, v])) : '<div class="mgmt-empty">Пока никто не заходил внутрь сервисов.</div>'}
    </div>

    <div class="mgmt-card">
      <div class="mgmt-lab">внешние сервисы</div>
      ${linkRows.length ? bars(linkRows.map(([k,v]) => [linkName(k), v])) : '<div class="mgmt-empty">Внешние ссылки ещё не нажимали.</div>'}
    </div>

    <div class="mgmt-card">
      <div class="mgmt-lab">что именно нажимали</div>
      ${actRows.length ? `<table>
        <thead><tr><th>Действие</th><th class="mgmt-mono" style="text-align:right;width:70px">раз</th></tr></thead>
        <tbody>${actRows.map(([k,v]) => `<tr><td>${esc(k)}</td>
          <td class="mgmt-mono" style="text-align:right">${v}</td></tr>`).join('')}</tbody></table>`
        : '<div class="mgmt-empty">Кнопки внутри сервисов пока не нажимали.</div>'}
    </div>

    ${changes.length ? `<div class="mgmt-card">
      <div class="mgmt-lab">удаления и правки — ${changes.length} за ${DAYS} дней</div>
      <table>
        <thead><tr><th class="mgmt-mono">когда</th><th>что</th><th>название</th><th class="mgmt-mono">кто</th></tr></thead>
        <tbody>${changes.slice(0,20).map(e => `
          <tr>
            <td class="mgmt-mono">${new Date(e.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>

      </table>
      <div class="mgmt-note mgmt-warn"><span>!</span><span>Удаления необратимы: политики базы открыты, и промт или трек может удалить любой, кто открыл сервис. Скачивайте выгрузки на вкладке «Обслуживание».</span></div>
    </div>` : ''}

    <div class="mgmt-card">
      <div class="mgmt-lab">последние события</div>
      <table>
        <thead><tr><th class="mgmt-mono">когда</th><th>что</th><th>где</th><th class="mgmt-mono">кто</th></tr></thead>
        <tbody>${events.slice(0,25).map(e => `
          <tr>
            <td class="mgmt-mono">${new Date(e.at).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td>

    </div>

    ${events.some(e => !named.has(e.visitor)) ? `<div class="mgmt-note mgmt-info"><span>i</span><span>Часть событий подписана коротким кодом браузера — эти люди ещё не выбрали себя на главной хаба. Как только представятся, их прошлые события тоже подпишутся именем.</span></div>` : ''}

}

/* Пароли шифруются в браузере тем же паролем команды, которым дизайнеры
   входят в хаб. В код они не попадают: список вставляется здесь один раз. */
const PROBE_ID = '__probe__', PROBE_VAL = 'deckhub-ok';
let teamPass = null, vaultRows = [];

const b64 = {
  to: buf => btoa(String.fromCharCode(...new Uint8Array(buf))),
  from: s => Uint8Array.from(atob(s), c => c.charCodeAt(0))
};
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:200000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encryptSecret(pass, text){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv   = crypto.getRandomValues(new Uint8Array(12));
  const key  = await deriveKey(pass, salt);
  const data = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(text));
  return [b64.to(salt), b64.to(iv), b64.to(data)].join('.');
}
async function decryptSecret(pass, packed){
  const [s,i,d] = String(packed||'').split('.');
  if(!s || !i || !d) throw new Error('строка повреждена');
  const key = await deriveKey(pass, b64.from(s));
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64.from(i) }, key, b64.from(d)));
}

async function tryTeamPass(){
  const pass = ($('#mgTeamPass').value||'').trim();
  const err = $('#mgTeamErr');
  const fail = m => { err.style.display=''; err.querySelector('span:last-child').textContent = m; };
  if(pass.length < 6) return fail('Пароль короче шести символов не подойдёт');
  try{
    const rows = await vaultList();
    const probe = rows.find(r => r.id === PROBE_ID);
    if(probe){
      const v = await decryptSecret(pass, probe.secret);
      if(v !== PROBE_VAL) throw new Error('mismatch');
    } else {
      await post(MAIN, 'hub_vault', { id:PROBE_ID, service:'__probe__', login:'-', sort:-1,
                                      secret: await encryptSecret(pass, PROBE_VAL) });
    }
    teamPass = pass;
    vaultRows = (await vaultList()).filter(r => r.id !== PROBE_ID);
    renderVaultTab();
  }catch(e){
    fail(e.name === 'OperationError' || /mismatch|decrypt/i.test(e.message||'')
      ? 'Пароль не подошёл' : 'Не удалось: ' + (e.message || e.name));
  }
}

async function vaultRowAction(btn){

      if(btn.textContent === '🙈'){ cell.textContent = '••••••••'; btn.textContent = '👁'; return; }
      cell.textContent = await decryptSecret(teamPass, rec.secret);
      btn.textContent = '🙈';
    }
    if(btn.dataset.act === 'del'){
      if(!confirm(`Удалить доступ «${rec.service}» (${rec.login})?`)) return;
      await del(MAIN, 'hub_vault?id=eq.' + encodeURIComponent(rec.id));
      vaultRows = vaultRows.filter(r => r.id !== rec.id);

}

async function importVault(){
  const service = ($('#mgVService').value||'').trim();
  const text = $('#mgVPaste').value || '';
  if(!service){ toast('Укажите сервис'); return; }
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  if(!lines.length){ toast('Вставьте хотя бы одну строку'); return; }
  let ok = 0, bad = 0;
  for(const line of lines){
    /* строка вида «почта пароль»; лишние пробелы и нумерация отбрасываются */
    const clean = line.replace(/^\s*\d+[.)]\s*/, '');
    const parts = clean.split(/\s+/).filter(Boolean);
    const login = parts.shift();
    const secret = parts.join(' ');
    if(!login || !/@|\w/.test(login)){ bad++; continue; }
    try{
      const row = {
        id: (service + '-' + login).toLowerCase().replace(/[^a-zа-я0-9]+/gi,'-').slice(0,60),
        service, login, sort: (vaultRows.length + ok + 1) * 10,
        secret: secret ? await encryptSecret(teamPass, secret) : null
      };
      const [saved] = await post(MAIN, 'hub_vault', row);
      vaultRows.push(saved || row);
      ok++;
    }catch(e){ bad++; }
  }
  $('#mgVPaste').value = '';
  toast('Сохранено: ' + ok + (bad ? ', пропущено: ' + bad : ''));
  renderVaultTab();
}

async function wipe(path, ask){
  if(ask && !confirm(ask)) return;
  try{
    const rows = await api(MAIN, path, {method:'DELETE', headers:{Prefer:'return=representation'}});
    const n = Array.isArray(rows) ? rows.length : 0;
    toast(n ? `Удалено ${n} ${plural(n,'событие','события','событий')}` : 'Удалять было нечего');
    await loadAll();
  }catch(e){
    toast(/permission|denied|policy|42501/i.test(e.message)
      ? 'База не разрешает удаление — выполните последний блок из hub-admin.sql'
      : 'Не получилось: ' + e.message);
  }
}

async function dump(db, path, name){
  try{
    const rows = await get(db, path);
    const blob = new Blob([JSON.stringify(rows, null, 2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${name}-${dayKey(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast(`${rows.length} ${plural(rows.length,'запись','записи','записей')} в файле`);
  }catch(e){ toast('Не получилось: ' + e.message); }
}

      const mj=(a&b)^(a&c)^(b&c);
      const t2=(S0+mj)|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

async function sha256(text){
  try{
    if(crypto && crypto.subtle && crypto.subtle.digest){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return [...new Uint8Array(buf)].map(x=>x.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  return sha256js(text);           // https недоступен — считаем сами
}
const authed = () => { try{ return sessionStorage.getItem(SESSION)==='1' }catch(e){ return false } };
/* Узлы берём через getElementById: в одном из браузеров querySelector
   по этим же селекторам возвращал null. И видимость ставим прямым
   стилем — он сильнее любого правила из таблицы стилей, поэтому
   панель не может остаться скрытой из-за неожиданного CSS. */
const byId = id => document.getElementById(id);
function openPanel(){
  const screen=byId('screenAdmin'), gate=byId('mgGate'), panel=byId('mgPanel');
  if(screen) screen.classList.add('authed');
  if(gate){ gate.style.setProperty('display','none','important'); gate.hidden=true; }
  if(panel){ panel.style.setProperty('display','block','important'); panel.hidden=false; }
  window.scrollTo({top:0});
  window.dispatchEvent(new CustomEvent('admin:open'));
  guardPanel();
}

/* Страж. Панель показывается, а через мгновение исчезает — значит её
   кто-то прячет уже после нас. Кто именно, снаружи не видно, поэтому
   просто возвращаем видимость и запоминаем, сколько раз пришлось. */
let guardFixes = 0, guardStop = null;
function guardPanel(){
  const panel=byId('mgPanel'), gate=byId('mgGate');
  if(!panel) return;
  clearInterval(guardStop);
  const check = ()=>{
    if(!authed()) return;
    if(getComputedStyle(panel).display === 'none'){
      guardFixes++;
      panel.style.setProperty('display','block','important');
      panel.hidden = false;
      if(gate){ gate.style.setProperty('display','none','important'); gate.hidden = true; }
      const badge = document.querySelector('.build-badge');
      if(badge) badge.textContent = badge.textContent.replace(/ · вернул.*/,'') + ' · вернул панель ' + guardFixes + ' р.';
    }
  };
  let ticks = 0;
  guardStop = setInterval(()=>{ check(); if(++ticks > 40) clearInterval(guardStop); }, 150);
  check();
}
function closePanel(){
  const screen=byId('screenAdmin'), gate=byId('mgGate'), panel=byId('mgPanel');
  if(screen) screen.classList.remove('authed');
  if(gate){ gate.style.removeProperty('display'); gate.hidden=false; }
  if(panel){ panel.style.setProperty('display','none','important'); panel.hidden=true; }
}
function initAdmin(){
  const form=byId('mgGateForm'), inp=byId('mgPass'), err=byId('mgErr');
  if(!form || !inp || !err) return;
  async function tryLogin(){
    const pass=(inp.value||'').trim();          // пробел из автозаполнения — частая причина отказа
    if(!pass){ err.textContent='Введите пароль'; return; }
    err.textContent='Проверяю…';
    let ok=false;
    try{ ok = (await sha256(pass)) === ADMIN_HASH; }
    catch(e){ err.textContent='Не удалось проверить пароль: '+e.message; return; }
    if(!ok){ err.textContent='Пароль не подошёл'; inp.value=''; inp.focus(); return; }
    err.textContent='';
    try{ sessionStorage.setItem(SESSION,'1') }catch(e){}
    openPanel();
  }
  form.addEventListener('submit', e=>{ e.preventDefault(); tryLogin(); });
  const go=byId('mgGo');
  if(go) go.onclick=e=>{ e.preventDefault(); tryLogin(); };
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); tryLogin(); } });
  /* браузер часто подставляет сюда сохранённый пароль от домена —
     кнопка «показать» позволяет увидеть, что в поле на самом деле */
  const eye=byId('mgEye');
  if(eye) eye.onclick=()=>{
    const hidden = inp.type==='password';
    inp.type = hidden ? 'text' : 'password';
    eye.textContent = hidden ? 'скрыть' : 'показать';
    inp.focus();
  };
  const lock=byId('mgLock');
  if(lock) lock.onclick=()=>{
    try{ sessionStorage.removeItem(SESSION) }catch(e){}
    closePanel(); inp.value=''; err.textContent='';
  };
  ['hubBackAdmin','hubBackAdmin2'].forEach(id=>{ const b=byId(id); if(b) b.onclick=()=>{ location.href='index.html' }; });
}



initAdmin();
if(authed()) openPanel(); else { const p=byId('mgPass'); if(p) setTimeout(()=>p.focus(),50); }
})();
</script>
